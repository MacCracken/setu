name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version — no version is hardcoded in this YAML. Use
        # the upstream installer so the versioned ~/.cyrius/versions/<ver>/
        # layout matches how cyrius resolves the pin.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # `cyrius deps` copies the [deps].stdlib modules from the installed
        # toolchain into lib/. setu is a pure-Cyrius leaf contract — no
        # external libs. Never symlink lib/ to a cyrius checkout.
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Lint
        # Hard gate: any `warn` line (warning or untracked-deferral) fails CI.
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr; do
            [ -e "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -qE '^[[:space:]]*warn '; then
              echo "lint: warnings in $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        # cyrius fmt reports via EXIT CODE with --check (0 = clean); file goes
        # BEFORE the flag.
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr; do
            [ -e "$f" ] || continue
            if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet programs/smoke.cyr

      - name: Verify dist bundle is in sync with src/
        run: |
          cyrius distlib
          if ! git diff --quiet dist/setu.cyr; then
            echo "ERROR: dist/setu.cyr is stale. Run 'cyrius distlib' and commit the result."
            git --no-pager diff dist/setu.cyr | head -40
            exit 1
          fi
          echo "dist/setu.cyr matches src/"

      - name: No TCP on the agnos target
        # ⛔ setu 0.8.0's changelog states "the TCP arm is DELETED on agnos". It was deleted from
        # `setu_connect` only — `setu_listen`/`setu_accept` kept calling tcp_socket/sock_bind/
        # sock_listen/sock_accept with no #ifdef and survived FOUR cuts while every doc said otherwise.
        # A claim in a changelog is not a property of the code; this makes it one.
        run: sh scripts/check-no-tcp-on-agnos.sh

      - name: Verify dep sidecar states the DECLARED stdlib
        # ⛔ `cyrius distlib` (run in the step above) OVERWRITES dist/setu.deps with a fixed core
        # subset — 8 leaves where setu declares 12, dropping result/net/chrono/args. Measured: a
        # consumer that declares only those 8 builds "OK" on agnos with NO error, and on Linux emits
        # merely `warning: undefined function 'sys_uptime_ms'`. A correct sidecar instead makes cyrius
        # HARD ERROR ("dep setu requires 'chrono'") when a consumer under-declares — so this gate is
        # what turns a silent breakage into a build failure in the consumer's own repo.
        # Defect: docs/development/issues/2026-08-07-distlib-deps-sidecar-under-reports.md
        run: |
          sh scripts/sync-deps-sidecar.sh
          if ! git diff --quiet dist/setu.deps; then
            echo "ERROR: dist/setu.deps does not match [deps] stdlib in cyrius.cyml."
            echo "Run 'cyrius distlib && sh scripts/sync-deps-sidecar.sh' and commit the result."
            git --no-pager diff dist/setu.deps
            exit 1
          fi
          echo "dist/setu.deps matches the declared stdlib ($(grep -vc '^#' dist/setu.deps) leaves)"

      - name: Build (link-check, DCE on)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build programs/smoke.cyr build/setu-smoke
          echo "smoke: $(wc -c < build/setu-smoke) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/setu-smoke | grep -q "7f45 4c46"

      - name: Build (agnos target)
        # ⛔ CI BUILT ONLY LINUX UNTIL 0.8.3, AND setu'S AGNOS ARM IS THE ONE THAT MATTERS. Three
        # consecutive cuts shipped agnos-arm defects through a green pipeline: 0.8.0 left both poll
        # paths on `sys_read`, 0.8.1 left `setu_read_msg` stream-shaped, 0.8.2 hoisted `sys_uptime_ms`
        # (agnos-only) out of its `#ifdef`. None were reachable from Linux CI.
        # ⚠ These cannot be RUN here — there is no agnos host — so the gate is the BUILD. That is
        # enough: every defect above was a compile- or link-visible fact on the agnos arm.
        run: |
          mkdir -p build
          cyrius build --agnos programs/smoke.cyr build/setu-smoke_agnos
          for t in programs/*_test.cyr; do
            [ -e "$t" ] || continue
            name=$(basename "$t" .cyr)
            echo "== --agnos $t =="
            cyrius build --agnos "$t" "build/${name}_agnos"
          done
          echo "agnos target: all programs build"

      - name: Test (RUN suites)
        # Every programs/*_test.cyr is a self-checking RUN test: it exercises
        # the codec, asserts round-trip + rejection, and exits non-zero on
        # failure. Globbed so new suites are auto-picked.
        # ⭐ `reach_test.cyr` is the odd one out: it asserts nothing at runtime. Its value is entirely
        # at BUILD time — it forces the whole transport surface to be REACHABLE so that an undefined
        # function in it is a hard error instead of `warning: undefined function`. smoke.cyr calls
        # nothing, so DCE hid exactly that class. Do not "simplify" it by deleting the argc() guard:
        # a literal-false guard folds the block away and takes the reachability with it.
        run: |
          mkdir -p build
          for t in programs/*_test.cyr; do
            [ -e "$t" ] || continue
            name=$(basename "$t" .cyr)
            echo "== $t =="
            cyrius build "$t" "build/$name"
            "./build/$name" || { echo "FAIL: $t"; exit 1; }
          done
          for f in tests/tcyr/*.tcyr; do [ -e "$f" ] || continue; cyrius test "$f" || exit 1; done

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Matches code lines only — rejects patterns in # comments.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rnE "$pat" src/ programs/ 2>/dev/null | grep -vE '^\s*[^:]+:[0-9]+:\s*#' || true)
            if [ -n "$hits" ]; then
              echo "SECURITY: $label"; echo "$hits"; FAIL=1
            fi
          }
          # setu is a wire parser over untrusted bytes — flag any unchecked
          # dynamic exec / shell-out (there should be none in a pure codec).
          scan "shell/exec invocation" 'execve|system\(|popen\('
          [ $FAIL -eq 0 ] || { echo "security scan failed"; exit 1; }
          echo "security scan clean"
